services:
  nodejs:
    build:
      context: .
      dockerfile: docker/nodejs/Dockerfile
    container_name: placmitu_front_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/var/www/app
    networks:
      - placmitu_front_net
      - shared_dev_network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: placmitu_front_nginx_proxy
    ports:
      - "80:80"
    depends_on:
      - nodejs
    networks:
      - placmitu_front_net

networks:
  placmitu_front_net:
    driver: bridge

  shared_dev_network:
    external: true
